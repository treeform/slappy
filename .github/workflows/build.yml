name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby install -g "${{ github.event.repository.name }}/${{ github.event.repository.name }}.nimble"
      - name: Install OpenAL development library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenal-dev
      - run: nim r tests/tests.nim
      - name: Test audio lifecycle and reusable voices
        shell: bash
        run: |
          nim r tests/test_lifecycle.nim
          nim r -d:nimAllocStats tests/test_sources.nim
      - name: Test PCM buffers and playback fades
        shell: bash
        run: |
          nim r tests/test_pcm.nim
          nim r -d:nimAllocStats tests/test_source_fades.nim
      - name: Check WebAssembly API compatibility
        if: runner.os == 'Linux'
        run: nim check --os:linux --cpu:wasm32 -d:emscripten src/slappy.nim

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - name: Install Nim dependencies
        run: |
          cd ..
          nimby install -g "${{ github.event.repository.name }}/${{ github.event.repository.name }}.nimble"
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: '6.0.1'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test microphone capture with synthetic audio
        working-directory: tests/browser
        run: npm test
      - name: Build the interactive microphone example
        working-directory: tests
        run: nim c --threads:off -d:emscripten manual_browser_microphone.nim
